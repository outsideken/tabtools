[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabtools"
# The version lives only in tabtools/_version.py (read below).
dynamic = ["version"]
description = "Tabular profiling and anomaly scoring for the JEMA toolkit"
license = { text = "MIT" }
authors = [{ name = "OutsideKen" }]
requires-python = ">=3.9"

keywords = ["pandas", "analytics", "anomaly", "profiling", "tabular"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy",
    "pandas",
    "wherewhen>=0.2.0",
]

[tool.setuptools.dynamic]
version = { attr = "tabtools._version.__version__" }

[tool.setuptools.packages.find]
where   = ["."]
include = ["tabtools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]